[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-balancer"
version = "0.1.0"
description = "Quota balancer: standalone inventory store (Card 1)"
requires-python = ">=3.11"

[project.scripts]
quota = "quota_balancer.cli:main"

[tool.setuptools]
packages = ["quota_balancer"]
